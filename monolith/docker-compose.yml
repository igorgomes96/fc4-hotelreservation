services:
    postgres:
        image: postgres:16
        container_name: postgres-hotel
        environment:
            POSTGRES_DB: hotel_reservation
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: Test1234
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - hotelnet
    
    monolith-webapi:
        build:
            context: .
            dockerfile: src/FC4.HotelReservation.WebApi/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__HotelReservationDb: Host=postgres;Port=5432;Database=hotel_reservation;Username=postgres;Password=Test1234
        ports:
            - "8080:8080"
        networks:
            - hotelnet

networks:
    hotelnet:
        external: true
        
volumes:
    postgres_data: